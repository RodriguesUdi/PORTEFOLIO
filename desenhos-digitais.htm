<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Desenhos Digitais - Telmo Rodrigues</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #fafafa;
  color: #222;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.desc {
  text-align: center;
  margin-bottom: 30px;
  font-size: 18px;
  color: #555;
}

/* --- GALERIA PRINCIPAL --- */

.digital-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 25px;
}

.main-image-wrapper {
  max-width: 600px;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid #ddd;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.main-image-wrapper img {
  width: 100%;
  display: block;
  transition: transform 0.4s ease;
}

/* zoom ao passar o cursor */
.main-image-wrapper img:hover {
  transform: scale(1.08);
}

.nav-btn {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, transform 0.2s;
}

.nav-btn:hover {
  background: #f0f0f0;
  transform: scale(1.05);
}

/* --- MINIATURAS --- */

.thumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.thumbs img {
  width: 90px;
  height: auto;
  border-radius: 6px;
  border: 1px solid #ddd;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s, transform 0.2s;
}

.thumbs img:hover {
  opacity: 1;
  transform: scale(1.05);
}

.thumbs img.active-thumb {
  opacity: 1;
  border-color: #222;
}
</style>
</head>

<body>

<div class="container">
  <h1>Desenhos Digitais</h1>
  <p class="desc">
    Série de desenhos digitais em exploração de gesto, textura e composição.
  </p>

  <div class="digital-wrapper">
    <button class="nav-btn" id="prevBtn">&#10094;</button>

    <div class="main-image-wrapper">
      <img id="mainDigital" src="desenhodigital1.png" alt="Desenho digital 1">
    </div>

    <button class="nav-btn" id="nextBtn">&#10095;</button>
  </div>

  <div class="thumbs">
    <img src="desenhodigital1.png" data-index="0" alt="Desenho digital 1">
    <img src="desenhodigital2.png" data-index="1" alt="Desenho digital 2">
    <img src="desenhodigital3.png" data-index="2" alt="Desenho digital 3">
    <img src="desenhodigital4.png" data-index="3" alt="Desenho digital 4">
    <img src="desenhodigital5.png" data-index="4" alt="Desenho digital 5">
    <img src="desenhodigital6.png" data-index="5" alt="Desenho digital 6">
    <img src="desenhodigital7.png" data-index="6" alt="Desenho digital 7">
  </div>
</div>

<script>
  const images = [
    "desenhodigital1.png",
    "desenhodigital2.png",
    "desenhodigital3.png",
    "desenhodigital4.png",
    "desenhodigital5.png",
    "desenhodigital6.png",
    "desenhodigital7.png"
  ];

  let currentIndex = 0;

  const mainImg = document.getElementById("mainDigital");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const thumbs = document.querySelectorAll(".thumbs img");

  function updateImage(index) {
    currentIndex = index;
    mainImg.src = images[currentIndex];
    thumbs.forEach((t, i) => {
      t.classList.toggle("active-thumb", i === currentIndex);
    });
  }

  prevBtn.addEventListener("click", () => {
    const newIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage(newIndex);
  });

  nextBtn.addEventListener("click", () => {
    const newIndex = (currentIndex + 1) % images.length;
    updateImage(newIndex);
  });

  thumbs.forEach((thumb, i) => {
    thumb.addEventListener("click", () => updateImage(i));
  });
