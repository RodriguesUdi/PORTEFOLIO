<title>Portefólio - Telmo Rodrigues</title>

<meta name="theme-color" content="#151513">

/* Variáveis */
:root {
  --bg: #151513;
  --surface: #1c1c19;
  --text: #f1efe8;
  --muted: #a09e95;
  --line: #383832;
  --accent: #d2c9b5;
  --page-width: 1480px;
  --gutter: clamp(22px, 6.5vw, 100px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "DM Sans", sans-serif;
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 5px;
}

.container {
  width: calc(100% - var(--gutter) * 2);
  max-width: var(--page-width);
  margin-inline: auto;
}

.eyebrow {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .2em;
  line-height: 1.6;
  text-transform: uppercase;
  color: var(--muted);
}

.serif {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 400;
}

/* CABEÇALHO */
.header {
  border-bottom: 1px solid var(--line);
}

.header-inner {
  min-height: 84px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}

.brand {
  display: flex;
  flex-direction: column;
  line-height: 1.4;
}

.brand-name {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.brand-caption {
  margin-top: 4px;
  font-size: 10px;
  color: var(--muted);
}

.nav {
  display: flex;
  align-items: center;
  gap: clamp(18px, 3vw, 42px);
}

.nav a {
  position: relative;
  padding: 8px 0;
  color: #c3c1b8;
  font-size: 11px;
  transition: color .25s ease;
}

.nav a::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 2px;
  left: 0;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: right;
  transition: transform .3s ease;
}

.nav a:hover {
  color: var(--text);
}

.nav a:hover::after {
  transform: scaleX(1);
  transform-origin: left;
}

/* HERO */
.hero {
  padding-top: clamp(72px, 11vw, 150px);
}

.hero-heading {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 30px;
  margin-bottom: clamp(35px, 5vw, 65px);
}

.hero h1 {
  margin-top: 20px;
  font-size: clamp(58px, 10.8vw, 150px);
  line-height: .96;
  letter-spacing: -.065em;
}

.hero-side {
  padding-bottom: 9px;
  text-align: right;
}

.hero-side p {
  font-size: 11px;
  color: var(--muted);
}

.hero-side .discipline {
  margin-top: 8px;
  color: var(--text);
  letter-spacing: .04em;
}

/* FEATURED */
.featured {
  position: relative;
}

.featured-link {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1.9 / 1;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 60% 40%, #484238 0%, transparent 50%),
    linear-gradient(130deg, #292925, #10100f 75%);
}

.featured-link img {
  transition: transform 1s cubic-bezier(.2,.7,.2,1),
              opacity .4s ease;
}

.featured-link:hover img {
  transform: scale(1.025);
}

.featured-overlay {
  position: absolute;
  inset: auto 0 0;
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  padding: clamp(20px, 4vw, 48px);
  background: linear-gradient(transparent, rgba(0,0,0,.65));
  pointer-events: none;
}

.featured-title {
  font-size: clamp(25px, 4vw, 48px);
  line-height: 1.2;
}

.featured-caption {
  margin-top: 7px;
  color: #dedbd2;
  font-size: 11px;
}

.featured-arrow {
  flex: 0 0 auto;
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 50%;
  font-size: 20px;
}

.image-credit {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding-top: 13px;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .13em;
  text-transform: uppercase;
}

/* ABOUT */
.about {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: clamp(35px, 9vw, 140px);
  padding-block: clamp(110px, 15vw, 205px);
  border-bottom: 1px solid var(--line);
}

.about-heading h2 {
  margin-top: 24px;
  font-size: clamp(36px, 5.2vw, 70px);
  line-height: 1.12;
  letter-spacing: -.04em;
}

.about-heading .artist-role {
  margin-top: 24px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}

.about-copy {
  max-width: 650px;
  padding-top: 28px;
}

.about-copy p {
  margin-bottom: 24px;
  color: #c5c3bb;
  font-size: clamp(13px, 1.15vw, 15px);
  line-height: 2;
}

.about-copy strong {
  display: block;
  margin-top: 35px;
  color: var(--text);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.9;
}

/* WORK */
.work {
  padding-block: clamp(100px, 13vw, 175px);
}

.work-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 30px;
  margin-bottom: 50px;
}

.work-heading h2 {
  margin-top: 16px;
  font-size: clamp(39px, 6vw, 76px);
  line-height: 1.08;
  letter-spacing: -.045em;
}

.work-note {
  max-width: 250px;
  padding-bottom: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(35px, 5vw, 72px) 24px;
}

.category {
  display: block;
  min-width: 0;
}

.category-image {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1.3 / 1;
  background:
    radial-gradient(ellipse at 40% 35%, #48453d, transparent 65%),
    #242420;
}

.category-image img {
  transition: transform .8s cubic-bezier(.2,.7,.2,1),
              opacity .4s ease;
}

.category:hover .category-image img {
  transform: scale(1.045);
}

.category-topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-top: 20px;
}

.category-number {
  font-size: 10px;
  letter-spacing: .13em;
  color: var(--muted);
}

.category-arrow {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--text);
  font-size: 17px;
  transition: background .3s ease, color .3s ease,
              border-color .3s ease, transform .3s ease;
}

.category:hover .category-arrow {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
  transform: rotate(45deg);
}

.category h3 {
  margin-top: 8px;
  font-size: clamp(29px, 4vw, 48px);
  line-height: 1.2;
  letter-spacing: -.025em;
  transition: color .3s ease;
}

.category:hover h3 {
  color: var(--accent);
}

.category-description {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}

/* CONTACT */
.contact {
  padding-block: clamp(85px, 12vw, 155px);
  border-top: 1px solid var(--line);
  background:
    radial-gradient(ellipse at 90% 100%, rgba(100,94,76,.08), transparent 50%);
}
