<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Esculturas · Portefólio</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f7f7;
      color: #222;
      margin: 0;
      padding: 0;
    }

    .voltar {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #fff;
      border: 2px solid #000;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      color: #000;
      z-index: 1000;
    }

    .voltar:hover {
      background: #000;
      color: #fff;
    }

    main {
      padding: 80px 40px 40px;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .grupo {
      margin-bottom: 60px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .grupo h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .grupo p {
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 6px;
      cursor: zoom-in;
      border: 1px solid #ccc;
      transition: filter 0.2s;
    }

    .gallery img:hover {
      filter: brightness(0.9);
    }
