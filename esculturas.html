<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Esculturas · Portefólio</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f7f7;
      color: #222;
      margin: 0;
      padding: 0;
    }

    .voltar {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #fff;
      border: 2px solid #000;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      color: #000;
      z-index: 1000;
    }

    .voltar:hover {
      background: #000;
      color: #fff;
    }

    main {
      padding: 80px 40px 40px;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .grupo {
      margin-bottom: 60px;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .grupo h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .grupo p {
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 6px;
      cursor: zoom-in;
      border: 1px solid #ccc;
      transition: filter 0.2s;
    }

    .gallery img:hover {
      filter: brightness(0.9);
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
      transition: transform 0.2s;
    }

    .fechar, .anterior, .seguinte {
      position: absolute;
      color: #fff;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .fechar { top: 20px; right: 30px; }
    .anterior { left: 40px; top: 50%; transform: translateY(-50%); }
    .seguinte { right: 40px; top: 50%; transform: translateY(-50%); }

    .zoom-controls {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: flex;
      gap: 15px;
    }

    .zoom-btn {
      background: #fff;
      color: #000;
      font-size: 22px;
      font-weight: bold;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 2px solid #000;
    }

    .zoom-btn:hover {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>

<a href="index.html" class="voltar">←</a>

<main>
  <h1>Esculturas</h1>

  <!-- GRUPO 1 -->
  <div class="grupo">
    <h2>Angel I</h2>
    <p>Escultura em resina com acabamento suave, explorando formas orgânicas e gestos ascendentes.</p>

    <div class="gallery">
      <img src="esculturaangel1.jpg" alt="Angel 1">
      <img src="esculturaangel2.jpg" alt="Angel 2">
      <img src="esculturaangel3.png" alt="Angel 3">
      <img src="esculturaangel4.png" alt="Angel 4">
    </div>
  </div>

  <!-- GRUPO 2 -->
  <div class="grupo">
    <h2>Forma e Matéria</h2>
    <p>Peça em argila com foco na textura e no equilíbrio entre massa e vazio.</p>

    <div class="gallery">
      <img src="escultura1.jpg" alt="Escultura 1">
      <img src="escultura2.jpg" alt="Escultura 2">
    </div>
  </div>

</main>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="fechar" id="fechar">X</span>
  <span class="anterior" id="anterior">‹</span>
  <img id="imagemModal" src="">
  <span class="seguinte" id="seguinte">›</span>

  <div class="zoom-controls">
    <div class="zoom-btn" id="zoomIn">+</div>
    <div class="zoom-btn" id="zoomOut">−</div>
  </div>
</div>

<script>
  const imagens = document.querySelectorAll('.gallery img');
  const modal = document.getElementById('modal');
  const imagemModal = document.getElementById('imagemModal');
  const fechar = document.getElementById('fechar');
  const anterior = document.getElementById('anterior');
  const seguinte = document.getElementById('seguinte');
  const zoomIn = document.getElementById('zoomIn');
  const zoomOut = document.getElementById('zoomOut');

  let indiceAtual = 0;
  let zoom = 1;

  imagens.forEach((img, i) => {
    img.addEventListener('click', () => {
      indiceAtual = i;
      abrirModal();
    });
  });

  function abrirModal() {
    modal.style.display = 'flex';
    imagemModal.src = imagens[indiceAtual].src;
    zoom = 1;
    imagemModal.style.transform = `scale(${zoom})`;
  }

  fechar.addEventListener('click', () => modal.style.display = 'none');

  anterior.addEventListener('click', () => {
    indiceAtual = (indiceAtual - 1 + imagens.length) % imagens.length;
    imagemModal.src = imagens[indiceAtual].src;
    zoom = 1;
    imagemModal.style.transform = `scale(${zoom})`;
  });

  seguinte.addEventListener('click', () => {
    indiceAtual = (indiceAtual + 1) % imagens.length;
    imagemModal.src = imagens[indiceAtual].src;
    zoom = 1;
    imagemModal.style.transform = `scale(${zoom})`;
  });

  zoomIn.addEventListener('click', () => {
    zoom += 0.2;
    imagemModal.style.transform = `scale(${zoom})`;
  });

  zoomOut.addEventListener('click', () => {
    zoom = Math.max(0.4, zoom - 0.2);
    imagemModal.style.transform = `scale(${zoom})`;
  });

  modal.addEventListener('click', e => {
    if (e.target === modal) modal.style.display = 'none';
  });
</script>

</body>
</html>
